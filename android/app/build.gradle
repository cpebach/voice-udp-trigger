plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cpebach.voiceudptrigger'
    compileSdk 34

    defaultConfig {
        applicationId "com.cpebach.voiceudptrigger"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
        ndk {
            // スマートフォン向けにABIを絞ってAPKを軽くする
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Voskモデルのアセットを圧縮しない(展開高速化)
    androidResources {
        noCompress 'mdl', 'car', 'conf', 'fst', 'int', 'ie', 'clp', 'txt', 'ark', 'lat', 'il8n', 'bin', 'pdf'
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
